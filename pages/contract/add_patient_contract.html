<!DOCTYPE html>
<html lang="en">
<head>
    <title>Add Contract Form</title>
</head>
<body>
    <h1>Add Patient Contract</h1>
    <form action="" method="post">
        <label for="pid">Patient ID:</label>
        <input type="text" name="pid" value="" required>
        <label for "approver">Enter Approver's Name:</label> 
        <input type="text" name="approver" value="" required> 
        <label for="approved_date">Enter Approved Date:</label> 
        <input type="date" name="approved_date" value="" required> 
        <label for="hcp">Enter Health Care Provider:</label> 
        <input type="text" name="hcp" value="" required>  
        <label for="payment_mode">Enter Payment Mode:</label>  
        <input type="text" name="payment_mode" value="" required>  
        <label for="amount_paid">Enter Amount Paid:</label>  
        <input type="number" name="amount_paid" value="" required>  
        <label for="amount_due">Enter Amount Due:</label>  
        <input type="number" name="amount_due" value="" required>  
        <button type="submit">Add Contract</button>
    </form>
</body>
</html>
